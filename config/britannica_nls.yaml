# Britannica NLS Collection - File-Based Pipeline Configuration
# Processing editions: 2nd (EB.4), Supp 3rd (EB.7), 6th (EB.11),
# Supp 4/5/6 (EB.12), 7th (EB.15), 8th (EB.16)
# Total: 82 volumes, ~73,294 pages

# Paths to existing component repositories
components:
  olmocr_repo: /home/jic823/projects/def-jic823/archive-olm-pipeline/olmocr

# Base directory for file-based pipeline
directories:
  base_dir: /home/jic823/projects/def-jic823/britannica_pipeline

# OCR phase settings
ocr:
  pdfs_per_batch: 200  # Minimum PDFs before submitting (we have 82)
  check_interval: 60   # Seconds between dispatcher checks

# Cleanup settings
cleanup:
  check_interval: 60   # Seconds between cleanup checks
  auto_delete_pdfs: false  # Keep PDFs since they were converted locally

# SLURM settings
slurm:
  email: jic823@usask.ca
  account: def-jic823
  time_limit: "48:00:00"  # 2 days should be plenty for 73K pages

# Logging
logging:
  level: INFO
